name: CI/CD

# Same pipeline shape as dreamteam:
#
#   PR:            checks + test (gate only)
#   push to main:  checks(+artifact) + test ─ deploy (reuses the build)
#
# There is no staging: merges to main deploy straight to production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run mid-deploy; superseded PR runs are fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint / Types / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run check
      - name: Type check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:run

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Installed for wrangler alone, pinned by bun.lock (same binary as
      # `bun run ship` locally).
      - run: bun install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Worker secrets (BETTER_AUTH_SECRET, BETTER_AUTH_URL, GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET) are set out-of-band with `wrangler secret put`.
      # D1 migrations are applied by hand: `bun run db:migrate:remote`.
      - name: Deploy
        run: bunx wrangler deploy dist/server/index.js --config wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Verifies the Worker + D1 and starts the Scheduler loop (docs/adr/0001,
      # "Scheduling"), so schedules sync without waiting for a visitor.
      - name: Smoke check /health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://sportsline.dev/health
