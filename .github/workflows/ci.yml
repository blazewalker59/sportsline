name: CI/CD

# One gate: `bun run ci` (format, lint, types, db:check, tests, build).
# Local `bun run ci` and `bun run ship` call that same script. `ship` and the
# deploy job then run `bun run deploy` (remote D1 migrations, then wrangler).
#
#   PR:            ci (gate only)
#   push to main:  ci (+artifact) ─ deploy (reuses the build)
#
# There is no staging: merges to main deploy straight to production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run mid-deploy; superseded PR runs are fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Check, test, and build
        run: bun run ci
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Installed for wrangler alone, pinned by bun.lock (same binary as
      # `bun run ship` locally).
      - run: bun install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Secrets (see README and .env.example) are set out-of-band with
      # `wrangler secret put`. Migrations go first, so new code never queries
      # columns that don't exist yet; a failure here stops the deploy.
      # Same command as `bun run deploy` / `bun run ship`.
      - name: Apply D1 migrations and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Verifies the Worker + D1 and starts the Scheduler loop (docs/adr/0001,
      # "Scheduling"), so schedules sync without waiting for a visitor.
      - name: Smoke check /health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://sportsline.dev/health
